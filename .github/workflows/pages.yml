name: Website

# The project site (site/) plus the layouts RenderTest draws from the real overlay
# code, deployed straight to GitHub Pages on every push to main (or by hand). No
# branch holds the site: Settings → Pages → Source must be "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # the overlay loads the Karoo's font from /system/fonts: same font in the renders
      - name: Karoo font
        run: |
          sudo mkdir -p /system/fonts
          sudo curl -fsSL -o /system/fonts/IBMPlexSansCondensed-Medium.otf \
            https://raw.githubusercontent.com/IBM/plex/master/packages/plex-sans-condensed/fonts/complete/otf/IBMPlexSansCondensed-Medium.otf

      - name: Render the layouts
        run: ./gradlew testDebugUnitTest --tests "com.angkyria.karooworkout.RenderTest"

      - name: Assemble the site
        run: |
          mkdir -p _site/img
          cp -R site/. _site/
          cp app/build/screenshots/*.png _site/img/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
