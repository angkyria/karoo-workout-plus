name: Website

# The project site (site/) plus the layouts RenderTest draws from the real overlay
# code, published to the gh-pages branch on every push to main (or by hand).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # the overlay loads the Karoo's font from /system/fonts: same font in the renders
      - name: Karoo font
        run: |
          sudo mkdir -p /system/fonts
          sudo curl -fsSL -o /system/fonts/IBMPlexSansCondensed-Medium.otf \
            https://raw.githubusercontent.com/IBM/plex/master/packages/plex-sans-condensed/fonts/complete/otf/IBMPlexSansCondensed-Medium.otf

      - name: Render the layouts
        run: ./gradlew testDebugUnitTest --tests "com.angkyria.karooworkout.RenderTest"

      - name: Assemble the site
        run: |
          mkdir -p _site/img
          cp -R site/. _site/
          cp app/build/screenshots/*.png _site/img/
          touch _site/.nojekyll

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
