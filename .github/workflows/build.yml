name: Build

# Every branch push (or a manual run): unit tests + the debug APK, attached to the
# run as an artifact. Tags are release.yml's.
#
# The runner makes a fresh debug key each time: a phone with a build signed by
# another debug key needs `adb uninstall com.angkyria.karooworkout` first.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: karoo-workout-plus-debug
          path: app/build/outputs/apk/debug/karoo-workout-plus-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
